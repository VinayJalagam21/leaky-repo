name: Trivy-Secret-Scan
on:
  push:
    branches:
      - main
      - stage
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trivy-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Fetch only the latest commit

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv trivy /usr/local/bin/

      - name: Verify Trivy Installation
        run: trivy --version

      - name: Run Trivy Secret Scan (Latest Commit Only)
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Scanning changed files: $CHANGED_FILES"
            trivy fs --scanners secret \
              --exit-code 1 \
              --no-progress \
              --ignore-unfixed \
              --skip-dirs ".git" \
              --detection-priority "precise" \
              --format json \
              --output trivy-report.json \
              $CHANGED_FILES || echo "Trivy found secrets!"
          else
            echo "No changed files detected, skipping scan."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-scan-report
          path: trivy-report.json
