name: PR-Trivy-Secret-Scan

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secret-scan:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures we get the latest commit for scanning

      - name: Install Trivy (Manual Fallback)
        run: |
          # Try installing Trivy using script
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          
          # Add Trivy bin path
          echo "$HOME/bin" >> $GITHUB_PATH
          
          # Verify if Trivy is installed
          if ! command -v trivy &> /dev/null; then
            echo "Trivy is not found! Installing via APT..."
            
            # Add Trivy repository and install via APT
            sudo apt-get update
            sudo apt-get install -y gnupg curl
            curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo tee /etc/apt/trusted.gpg.d/trivy.asc
            echo "deb https://aquasecurity.github.io/trivy-repo/deb stable main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update && sudo apt-get install -y trivy
          fi

          # Final verification
          trivy --version || (echo "Trivy installation failed!" && exit 1)

      - name: Run Trivy Secret Scan (Scan Only Changed Files)
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1)
          if [[ -n "$CHANGED_FILES" ]]; then
            trivy fs --scanners secret --exit-code 1 --no-progress --ignore-unfixed --skip-dirs ".git" --format json --output trivy-report.json $CHANGED_FILES || echo "Trivy found secrets!"
          else
            echo "No changed files to scan."
          fi

      - name: Upload Secret Scan Report (If Secrets Found)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-scan-report
          path: trivy-report.json
