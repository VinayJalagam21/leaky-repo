name: PR-Trivy-Secret-Scan

on:
  push:
    branches:
      - master
      - stage
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secret-scan:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures we have the latest commit for scanning

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      - name: Run Trivy Secret Scan (Latest Commit Only)
        run: |
          trivy fs --scanners secret \
            --exit-code 1 \
            --no-progress \
            --ignore-unfixed \
            --skip-dirs ".git" \
            --detection-priority "precise" \
            --format json \
            --output trivy-report.json \
            $(git diff --name-only HEAD~1) || echo "Trivy found secrets!"

      - name: Upload Secret Scan Report (if secrets found)
        if: failure()  # Upload report only if secrets were found
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-scan-report
          path: trivy-report.json
