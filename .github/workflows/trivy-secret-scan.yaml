name: Trivy-Secret-Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trivy-secret-scan:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures PR base commit is available

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/trivy

      - name: Verify Trivy Installation
        run: trivy --version

      - name: Fetch PR Base Branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Get Changed Files in PR
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          cat changed_files.txt || echo "No files changed."

      - name: Scan for Secrets in Changed Files
        run: |
          if [ -s changed_files.txt ]; then
            trivy fs --scanners secret \
              --exit-code 1 \
              --no-progress \
              --ignore-unfixed \
              --skip-dirs ".git" \
              --detection-priority "precise" \
              --format json \
              --output trivy-report.json \
              $(cat changed_files.txt) || echo "Trivy found secrets!"
          else
            echo "No files changed, skipping Trivy scan."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-scan-report
          path: trivy-report.json
