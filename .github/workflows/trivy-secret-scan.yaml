name: Trivy-Secret-Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trivy-secret-scan:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures PR base commit is available

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/trivy

      - name: Verify Trivy Installation
        run: trivy --version

      - name: Fetch PR Base Branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Get Changed Files in PR
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          cat changed_files.txt || echo "No files changed."

      - name: Scan for Secrets in Changed Files
        run: |
          mkdir -p trivy-reports
          if [ -s changed_files.txt ]; then
            while read -r file; do
              echo "Scanning $file..."
              safe_filename=$(echo "$file" | tr '/' '_')  # Replace / with _
              trivy fs --scanners secret \
                --exit-code 1 \
                --no-progress \
                --ignore-unfixed \
                --skip-dirs ".git" \
                --detection-priority "precise" \
                --format json \
                --output "trivy-reports/trivy-report-${safe_filename}.json" \
                "$file" || echo "Trivy found secrets in $file!"
            done < changed_files.txt
          else
            echo "No files changed, skipping Trivy scan."
          fi

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-scan-reports
          path: trivy-reports/*.json
